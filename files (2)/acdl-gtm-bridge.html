<script>
/*
 * ACDL -> GTM "aa" bridge  v1.1.0   (One Digital)
 *
 * Listens to window.adobeDataLayer and re-emits every event into
 * window.dataLayer in the EXISTING "aa" shape, so current GTM variables
 * (e.g. aa.page.page_title), triggers (e.g. spa_page_view) and tags keep
 * working unchanged.
 *
 * Deploy phase 1: GTM Custom HTML tag, trigger "Initialization - All Pages",
 *                 fire once per page, leave the tag's advanced settings at default.
 * Deploy phase 2: paste this exact block into <head>, after the
 *                 adobeDataLayer init and BEFORE the GTM snippet.
 * Running both at once is safe: the run-once guard means the first copy wins.
 *
 * Debug: add ?acdl_debug=1 to any URL to log every translation to the console.
 * ES5 only on purpose, so it runs in any GTM container and any browser.
 */
(function (w) {
  "use strict";
  if (w.__acdlBridge) { return; }                 // run-once guard
  w.__acdlBridge = { version: "1.1.0" };

  var ADL = w.adobeDataLayer = w.adobeDataLayer || [];
  var GDL = w.dataLayer = w.dataLayer || [];
  var DEBUG = /[?&]acdl_debug=1/.test(w.location.search);

  /* =====================================================================
   * CONFIG: the only part your team should need to edit.
   * ===================================================================== */

  // ACDL event name -> GTM event name. Anything not listed keeps its name.
  var EVENT_MAP = {
    page_view:      "spa_page_view",
    checkout:       "begin_checkout",
    begin_checkout: "begin_checkout",
    purchase:       "purchase"
  };

  // ACDL events that start a new page. The GTM data model is reset first,
  // matching the existing dataLayer.push(function(){ this.reset(); }) pattern.
  var RESET_ON = {
    page_view: true
  };

  // ACDL events that carry basket data. The bridge clears the previous
  // ecommerce object first (Google's recommended { ecommerce: null } push),
  // then builds a GA4-format "ecommerce" object that GA4 tags read natively.
  var ECOM_EVENTS = {
    checkout:       true,
    begin_checkout: true,
    purchase:       true
  };

  // GA4 ecommerce key  <-  path inside the ACDL "data" object.
  // ASSUMED names: the visible Blueprint stops before any ecommerce block.
  // If the Blueprint uses different names, change the right-hand side only.
  var ECOM_MAP = {
    transaction_id: "transaction.id",
    value:          "transaction.value",     // if missing, summed from items
    currency:       "transaction.currency",  // if missing, falls back to site.currency
    tax:            "transaction.tax",
    coupon:         "transaction.coupon"
  };

  // Where the item list lives in ACDL data, and how each item maps to GA4.
  var ITEMS_PATH = "products";
  var ITEM_MAP = {
    item_id:        "id",
    item_name:      "name",
    item_brand:     "brand",
    item_category:  "category",
    item_category2: "subcategory",
    item_variant:   "variant",
    price:          "price",
    quantity:       "quantity",              // if missing, defaults to 1
    coupon:         "coupon",
    discount:       "discount"
  };

  // GA4 needs these as numbers. "£49.99" or "49.99" become 49.99.
  var NUMERIC = { value: true, tax: true, price: true, quantity: true, discount: true };

  // Target key in GTM  <-  source path inside the ACDL "data" object.
  // A source can also be a function(data, rawItem) that returns a value.
  // Lines marked TBC need the ACDL field name from the Analytics Blueprint.
  var FIELD_MAP = {
    // ---- event level (new, additive) ----
    "event_id":                       "event_id",
    "event_trigger":                  "event_trigger",

    // ---- aa.page: existing keys ----
    "aa.page.page_title":             "current_page.url_title",
    "aa.page.page_path":              "current_page.url_path",
    "aa.page.page_location":          "current_page.full_url",
    // "aa.page.brand_name":              TBC
    // "aa.page.insurance_product":       TBC (was derived from URL by 3W)
    // "aa.page.quote_engine_step_nr":    TBC
    // "aa.page.quote_engine_step_name":  TBC
    // "aa.page.quote_engine_additions.additional_drivers":    TBC
    // "aa.page.quote_engine_additions.additional_vehicles":   TBC
    // "aa.page.quote_engine_additions.additional_pets":       TBC
    // "aa.page.quote_engine_additions.additional_properties": TBC
    // "aa.page.quote_engine_additions.additional_businesses": TBC
    // "aa.page.original_quote_source":   TBC
    // "aa.page.preferred_payment_method":TBC
    // "aa.page.monthly_quote_amount":    TBC
    // "aa.page.annual_quote_amount":     TBC
    // "aa.page.payment_type_selection":  TBC

    // ---- aa.page: new keys ACDL gives us (additive, nothing breaks) ----
    "aa.page.page_type":              "current_page.page_type",
    "aa.page.page_domain":            "current_page.url_domain",
    "aa.page.previous_page_path":     "previous_page.url_path",
    "aa.page.previous_page_location": "previous_page.full_url",
    "aa.page.site_language":          "site.language",
    "aa.page.site_currency":          "site.currency",

    // ---- aa.user: existing keys ----
    "aa.user.user_id":                "user.user_identifier",  // confirm it is the same email hash as today
    // "aa.user.policy_name":             TBC
    // "aa.user.policy_quantity":         TBC
    // "aa.user.policy_status":           TBC
    // "aa.user.policy_reference":        TBC
    // "aa.user.quote_reference":         TBC
    // "aa.user.login_data.login_attempts": TBC
    // "aa.user.login_data.login_result":   TBC
    // "aa.user.login_data.error_message":  TBC

    // ---- aa.user: new ----
    "aa.user.login_status":           "user.login_status",
    // user.email_address is deliberately NOT mapped: raw PII must not reach GTM/GA4.

    // ---- aa.content: new ----
    "aa.content.type":                "content.type",
    "aa.content.id":                  "content.id",
    "aa.content.title":               "content.title",
    "aa.content.category":            "content.category",
    "aa.content.subcategory":         "content.subcategory"
  };

  /* =====================================================================
   * ENGINE: no edits needed below this line.
   * ===================================================================== */

  function get(obj, path) {
    var keys = path.split("."), i;
    for (i = 0; i < keys.length; i++) {
      if (obj === null || obj === undefined) { return undefined; }
      obj = obj[keys[i]];
    }
    return obj;
  }

  function set(obj, path, value) {
    var keys = path.split("."), i;
    for (i = 0; i < keys.length - 1; i++) {
      if (typeof obj[keys[i]] !== "object" || obj[keys[i]] === null) { obj[keys[i]] = {}; }
      obj = obj[keys[i]];
    }
    obj[keys[keys.length - 1]] = value;
  }

  function toNumber(v) {
    if (typeof v === "number") { return isNaN(v) ? undefined : v; }
    if (v === undefined || v === null || v === "") { return undefined; }
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? undefined : n;
  }

  function pick(src, map) {
    var out = {}, key, val;
    for (key in map) {
      if (!map.hasOwnProperty(key)) { continue; }
      val = get(src, map[key]);
      if (NUMERIC[key]) { val = toNumber(val); }
      if (val !== undefined && val !== null && val !== "") { out[key] = val; }
    }
    return out;
  }

  function buildEcommerce(data, name) {
    var list = get(data, ITEMS_PATH), items = [], total = 0, i, it, ecom, cur;
    if (!Array.isArray(list)) { list = list ? [list] : []; }   // a single object counts as one item
    for (i = 0; i < list.length; i++) {
      it = pick(list[i] || {}, ITEM_MAP);
      if (it.quantity === undefined) { it.quantity = 1; }
      it.index = i;
      if (it.price !== undefined) { total += it.price * it.quantity; }
      items.push(it);
    }
    ecom = pick(data, ECOM_MAP);
    if (ecom.currency === undefined) {
      cur = get(data, "site.currency");
      if (cur) { ecom.currency = cur; }
    }
    if (ecom.value === undefined && items.length) { ecom.value = Math.round(total * 100) / 100; }
    ecom.items = items;

    if (w.console) {
      if (!items.length) { w.console.warn("[acdl-bridge] " + name + " has no items at data." + ITEMS_PATH); }
      if (name === "purchase" && !ecom.transaction_id) {
        w.console.warn("[acdl-bridge] purchase has no transaction_id, so GA4 cannot de-duplicate it");
      }
    }
    return ecom;
  }

  function translate(item) {
    // Accepts the Blueprint shape {event, data} and Adobe's standard {event, eventInfo}
    var name = item.event || item.eventName;
    var data = item.data || item.eventInfo || {};
    var out = { event: EVENT_MAP.hasOwnProperty(name) ? EVENT_MAP[name] : name, acdl_event: name };
    var key, src, val;
    for (key in FIELD_MAP) {
      if (!FIELD_MAP.hasOwnProperty(key)) { continue; }
      src = FIELD_MAP[key];
      val = (typeof src === "function") ? src(data, item) : get(data, src);
      if (val !== undefined && val !== null && val !== "") { set(out, key, val); }
    }
    return out;
  }

  function forward(item) {
    try {
      // Only plain event objects. Functions and state-only pushes are ignored.
      if (!item || typeof item !== "object" || !(item.event || item.eventName)) { return; }
      // Never send the same object twice. The Adobe library re-pushes the
      // existing queue when it boots, so this stops duplicates at handover.
      if (item.__acdlSent) { return; }
      try { Object.defineProperty(item, "__acdlSent", { value: true }); } catch (ignore) {}
      var name = item.event || item.eventName;
      var mapped = translate(item);
      if (RESET_ON.hasOwnProperty(name)) {
        GDL.push(function () { this.reset(); });
      }
      if (ECOM_EVENTS.hasOwnProperty(name)) {
        mapped.ecommerce = buildEcommerce(item.data || item.eventInfo || {}, name);
        GDL.push({ ecommerce: null });              // clear the previous basket
      }
      GDL.push(mapped);
      if (DEBUG && w.console) { w.console.log("[acdl-bridge]", name, "->", mapped); }
    } catch (e) {
      // A mapping bug must never break the site's own tracking call.
      if (w.console) { w.console.warn("[acdl-bridge] skipped an event:", e); }
    }
  }

  // Wrap whatever push currently exists (native, or the Adobe library's own).
  function wrap() {
    var inner = ADL.push;
    if (inner && inner.__acdlBridged) { return; }
    var wrapped = function () {
      var result = inner.apply(ADL, arguments);   // site's push always runs first
      var i;
      for (i = 0; i < arguments.length; i++) { forward(arguments[i]); }
      return result;
    };
    wrapped.__acdlBridged = true;
    ADL.push = wrapped;
  }

  // 1. Replay events that were pushed before this script ran (e.g. before GTM loaded).
  var i;
  for (i = 0; i < ADL.length; i++) { forward(ADL[i]); }

  // 2. Catch everything from now on.
  wrap();

  // 3. If the Adobe Client Data Layer library loads later, it replaces push.
  //    It runs queued functions when it boots, so this one re-wraps its push.
  //    Without the library, this function just sits in the array doing nothing.
  Array.prototype.push.call(ADL, function () {
    wrap();
    w.setTimeout(wrap, 0);
  });
})(window);
</script>

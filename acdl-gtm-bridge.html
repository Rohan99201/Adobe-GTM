<script>
/*
 * ACDL -> MSG "aa" bridge  v3.2.0   (One Digital / Markerstudy Group)
 *
 * Source: window.adobeDataLayer, as specified in the Analytics Blueprint.
 * Target: window.dataLayer, in the exact shape of the MSG Global Analytics
 *         Tracking Documentation v0.9 (aa.page, aa.user, aa_login,
 *         aa_form_submit, aa_begin_checkout, aa_purchase and so on), so the
 *         existing GTM variables, triggers and tags keep working unchanged.
 *
 * Deploy phase 1: GTM Custom HTML tag, trigger "Initialization - All Pages",
 *                 tag firing option "Once per page".
 * Deploy phase 2: paste this exact block into <head>, after the
 *                 adobeDataLayer init and BEFORE the GTM snippet.
 * Running both at once is safe: the run-once guard means the first copy wins.
 *
 * Built to last:
 *  - Future ACDL events are never lost: unmapped ones reach GTM as aa_<name>,
 *    with their data flattened into single keys under aa{} (aa.hello, not
 *    aa.rohantest.hello), so one GTM variable reads each value.
 *  - New mappings are a few lines in CUSTOM_RULES (or acdlBridge.addRule from
 *    another tag). The engine below never needs editing.
 *  - Privacy guard on EVERY push: PII keys dropped; emails, card numbers,
 *    UK phone numbers and postcodes redacted inside any string, URLs included.
 *  - Protection: event_id de-duplication, per-second and per-page rate limits,
 *    size limits, error isolation, and a kill switch.
 *  - Self-monitoring: problems are pushed as acdl_bridge_health so a GA4 tag
 *    can report Blueprint drift, PII leaks or errors from production.
 *  - Live stats in window.__acdlBridge.stats (counts and processing time).
 *
 * Debug: add ?acdl_debug=1 to any URL to log every translation to the console.
 * Kill switch: set window.__acdlBridgeOff = true before this runs, or add ?acdl_off=1.
 * ES5 only on purpose, so it runs in any GTM container and any browser.
 */
(function (w) {
  "use strict";
  var VERSION = "3.2.0";
  if (w.__acdlBridge) { return; }                 // run-once guard
  if (w.__acdlBridgeOff === true || /[?&]acdl_off=1/.test(w.location.search)) { return; }  // kill switch

  var ADL = w.adobeDataLayer = w.adobeDataLayer || [];
  var DATALAYER_NAME = "dataLayer";               // MSG / GTM data layer name
  var GDL = w[DATALAYER_NAME] = w[DATALAYER_NAME] || [];
  var DEBUG = /[?&]acdl_debug=1/.test(w.location.search);

  /* =====================================================================
   * CONFIG
   * ===================================================================== */

  // Every ACDL event name the Blueprint uses (its overview table and its code
  // examples disagree in places, so both spellings are listed) -> MSG rule.
  var EVENT_RULES = {
    page_view:          "page",          // -> aa push (first load) / spa_page_view
    standard_page_view: "page",
    user_login:         "login",         // -> aa_login
    log_in:             "login",
    user_failed_login:  "login_failed",  // -> aa_login_failed (new: MSG has no failed-login event)
    account_creation:   "sign_up",       // -> aa_sign_up (MSG: account registration)
    form_submission:    "form",          // -> aa_form_submit
    form_submit:        "form",
    lookup_interaction: "lookup",        // -> aa_lookup
    chat_start:         "live_chat",     // -> aa_live_chat
    payment_start:      "begin_checkout",// -> aa_begin_checkout
    policy_purchase:    "purchase",      // -> aa_purchase
    payment_success:    "purchase"
  };
  var QUOTE_START_EVENTS = { quote_start: true };  // clears remembered quote data

  // First full page load: MSG pushes aa data with NO event before GTM loads.
  // Leave "" to match that exactly. Set a name (e.g. "aa_page_data") if you
  // want a trigger for it during phase 1 testing.
  var FIRST_LOAD_EVENT = "";

  // ACDL events with no MSG mapping are forwarded as "aa_<name>" with their
  // (privacy-scrubbed) data under aa{}, so new tags can use them straight away.
  var FORWARD_UNMAPPED = true;
  var UNMAPPED_PREFIX = "aa_";
  var UNMAPPED_CONTAINER = "aa";

  // Event names MSG already owns. If a new ACDL event would land on one of
  // these (e.g. the Blueprint's newsletter "sign_up" -> "aa_sign_up", which is
  // MSG's account registration), it is sent as "aa_acdl_<name>" instead, so
  // existing tags never fire on the wrong thing.
  var MSG_EVENTS = {
    spa_page_view: 1, aa_login: 1, aa_login_failed: 1, aa_sign_up: 1, aa_form_submit: 1,
    aa_lookup: 1, aa_live_chat: 1, aa_begin_checkout: 1, aa_purchase: 1, acdl_bridge_health: 1
  };
  var COLLISION_PREFIX = "aa_acdl_";

  // How unknown events are laid out under aa{}.
  //  "full":      every value is one key.  {rohantest:{hello, nested:{level}}}
  //               -> aa.hello, aa.nested_level
  //  "one_level": only the outer wrapper is removed -> aa.hello, aa.nested.level
  //  "off":       data kept exactly as sent         -> aa.rohantest.hello
  // Two objects with the same key name (quote.status, payment.status) keep
  // their wrapper name on that key (quote_status, payment_status).
  // Lists of objects become one key per field, values joined with "|", plus
  // a _count key: add_ons [{name:"a"},{name:"b"}] -> add_ons_name "a|b",
  // add_ons_count 2. This matches MSG's own policy_name "x|y" convention.
  var UNMAPPED_FLATTEN = "full";
  var LIST_SEPARATORS = ["|", ",", ";"];   // outer list, list inside a list, deeper

  // Keys MSG owns inside aa{}. A new event carrying one of these (e.g. its own
  // "user" object) has it renamed to acdl_<key>, so it never mixes with or
  // replaces MSG values such as aa.user.user_id.
  var MSG_AA_KEYS = {
    page: 1, user: 1, ecommerce: 1, purchase_type: 1, form_name: 1, form_result: 1,
    error_message: 1, lookup_name: 1, lookup_result: 1
  };

  // MSG brand lookup table: ACDL sends lowercase, MSG keeps brand casing.
  var BRANDS = {
    "atlanta": "Atlanta", "atlanta group": "Atlanta", "autonet": "Autonet", "be wiser": "Be Wiser",
    "carole nash": "Carole Nash", "carole nash ie": "Carole Nash IE", "entire": "Entire",
    "express": "Express", "harley davidson": "Harley Davidson", "healthy pets": "Healthy Pets",
    "insurance4carhire": "Insurance4CarHire", "lloyd latchford": "Lloyd Latchford",
    "mackenzie hodgson": "Mackenzie Hodgson", "marmalade": "Marmalade",
    "paymentshield": "Paymentshield", "safeguard": "Safeguard", "scenic": "Scenic", "swinton": "Swinton"
  };
  // Used only when ACDL sends no brand_name. Checked in order (.ie before .com).
  var BRAND_DOMAINS = [
    ["carolenash.ie", "Carole Nash IE"], ["carolenash.com", "Carole Nash"],
    ["atlantagroup.co.uk", "Atlanta"], ["autonetinsurance.co.uk", "Autonet"], ["autonetmobility.co.uk", "Autonet"],
    ["bewiser.co.uk", "Be Wiser"], ["entirecoverinsurance.co.uk", "Entire"],
    ["expressbikeinsurance.com", "Express"], ["insurance.harley-davidson.uk", "Harley Davidson"],
    ["healthy-pets.co.uk", "Healthy Pets"], ["insurance4carhire.com", "Insurance4CarHire"],
    ["mydealerservices.co.uk", "Lloyd Latchford"], ["mackenziehodgson.co.uk", "Mackenzie Hodgson"],
    ["wearemarmalade.co.uk", "Marmalade"], ["paymentshield.co.uk", "Paymentshield"],
    ["safeguarduk.co.uk", "Safeguard"], ["scenicinsurance.co.uk", "Scenic"], ["swinton.co.uk", "Swinton"]
  ];

  // ASSUMPTION to confirm: MSG payment_type is "credit card" / "direct debit",
  // but ACDL only sends the frequency. Common UK pattern used here.
  var PAYMENT_TYPE_BY_FREQUENCY = { annual: "credit card", monthly: "direct debit" };
  var DEFAULT_CURRENCY = "GBP";

  // MSG: quote fields are omitted on non-quote pages. Remembered quote data is
  // only added to page views that carry a quote_engine_step_nr.
  var QUOTE_FIELDS_ONLY_ON_QUOTE_PAGES = true;

  // ---- Future events: declarative rules, no engine code needed ----------
  // "acdl event name": { event: "gtm event name",
  //                      fields: { "target.path": "source.path" or [fallbacks] },
  //                      required: ["target.path", ...] }   // flagged if empty
  // Source paths are read from the ACDL "data" object. Example, left off:
  var CUSTOM_RULES = {
    // quote_saved: {
    //   event: "aa_quote_saved",
    //   fields: { "aa.user.quote_reference": "quote_information.quote_reference",
    //             "aa.page.annual_quote_amount": "quote_information.annual_quote_amount" },
    //   required: ["aa.user.quote_reference"]
    // }
  };

  // ---- Protection ---------------------------------------------------------
  var LIMITS = {
    perSecond: 100,        // more than this in one second = runaway loop, extra pushes dropped
    perPage: 2000,         // hard ceiling per page view lifetime
    maxString: 500,        // longer strings are cut (GA4 keeps 100 characters anyway)
    maxArray: 50,          // longer arrays are cut
    maxDepth: 10,          // deeper nesting is dropped
    rememberIds: 500,      // how many event_ids are kept for de-duplication
    slowEventMs: 20,       // a single event slower than this is reported (typical: under 1ms)
    healthEvents: 5,       // max acdl_bridge_health pushes per page
    maxFlatKeys: 150,      // max keys an unknown event can add under aa{}
    maxKeyLength: 60       // longer flattened key names are cut
  };

  // Keys whose text or number values are always dropped. Boolean values are
  // kept, so consent flags such as marketing_consent.email: true survive.
  var PII_KEYS = {
    email: 1, email_address: 1, phone: 1, phone_number: 1, telephone: 1, mobile: 1, mobile_number: 1,
    first_name: 1, last_name: 1, surname: 1, full_name: 1, date_of_birth: 1, dob: 1,
    address: 1, address_line_1: 1, address_line_2: 1, street: 1, postcode: 1, post_code: 1, zip: 1,
    card_number: 1, pan: 1, cvv: 1, sort_code: 1, account_number: 1, iban: 1,
    national_insurance: 1, ni_number: 1, licence_number: 1, driving_licence_number: 1,
    vehicle_registration: 1, registration_number: 1, reg_number: 1, ip_address: 1
  };
  // Keys that hold IDs are exempt from the pattern scan, so references such
  // as POL-1234 or long numeric transaction IDs are never mistaken for PII.
  var ID_KEY = /(^|_)(id|ids|reference|ref|uuid)$/;
  var PII_PATTERNS = {
    email:    /[a-z0-9._%+\-]+(?:@|%40)[a-z0-9.\-]+\.[a-z]{2,}/gi,
    card:     /\b(?:\d[ \-]?){12,18}\d\b/g,          // only redacted if it passes the Luhn check
    phone:    /(?:\+44\s?|\b0)(?:\d\s?){9,10}\b/g,  // UK numbers
    postcode: /\b[a-z]{1,2}\d[a-z\d]?\s*\d[a-z]{2}\b/gi // UK postcodes
  };

  /* =====================================================================
   * HELPERS
   * ===================================================================== */

  function get(obj, path) {
    var keys = path.split("."), i;
    for (i = 0; i < keys.length; i++) {
      if (obj === null || obj === undefined) { return undefined; }
      obj = obj[keys[i]];
    }
    return obj;
  }
  function firstOf() {                     // first argument that has a value
    for (var i = 0; i < arguments.length; i++) {
      if (arguments[i] !== undefined && arguments[i] !== null && arguments[i] !== "") { return arguments[i]; }
    }
    return undefined;
  }
  function lc(v) { return (typeof v === "string") ? v.toLowerCase() : v; }
  function str(v) { return (v === undefined || v === null || v === "") ? undefined : String(v); }
  function num(v) {
    if (typeof v === "number") { return isNaN(v) ? undefined : v; }
    if (v === undefined || v === null || v === "") { return undefined; }
    var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? undefined : n;
  }
  function isHash(v) { return typeof v === "string" && /^[a-f0-9]{64}$/i.test(v); }
  function warn(msg) { if (w.console) { w.console.warn("[acdl-bridge] " + msg); } }

  // MSG rule: omit keys with no value. Returns a clean copy.
  function clean(v) {
    var out, k, c, i;
    if (Array.isArray(v)) {
      out = [];
      for (i = 0; i < v.length; i++) { c = clean(v[i]); if (c !== undefined) { out.push(c); } }
      return out;
    }
    if (v && typeof v === "object") {
      out = {}; var any = false;
      for (k in v) {
        if (!v.hasOwnProperty(k)) { continue; }
        c = clean(v[k]);
        if (c !== undefined) { out[k] = c; any = true; }
      }
      return any ? out : undefined;
    }
    return (v === undefined || v === null || v === "") ? undefined : v;
  }

  function brandOf(v) {
    if (v) { return BRANDS[lc(v)] || v; }
    var host = lc(w.location.hostname), i;
    for (i = 0; i < BRAND_DOMAINS.length; i++) {
      var d = BRAND_DOMAINS[i][0];
      if (host === d || host.slice(-(d.length + 1)) === "." + d) { return BRAND_DOMAINS[i][1]; }
    }
    return undefined;
  }
  // "car insurance" / "Car" -> "car" (MSG insurance_product and item_category style)
  function productOf(v) { return v ? lc(String(v)).replace(/\s*insurance$/, "") : undefined; }
  function resultOf(v) {
    v = lc(v);
    if (v === "failed" || v === "fail" || v === "error") { return "failure"; }
    return v;
  }
  function extra(n) { n = num(n); return (n === undefined) ? undefined : String(Math.max(n - 1, 0)); }

  /* =====================================================================
   * REMEMBERED STATE
   * MSG puts quote amounts and login data on every page view, while ACDL
   * only sends them on quote and login events. The bridge remembers the
   * latest values so later page views carry them, as they do today.
   * ===================================================================== */
  var state = { pageViews: 0, brand: undefined, currency: undefined, quote: {}, login: {}, loginAttempts: 0 };

  function remember(name, d) {
    if (QUOTE_START_EVENTS[name]) { state.quote = {}; }
    var q = state.quote;
    var qi = d.quote_information || {}, b = d.basket || {}, p = d.payment || {};
    var r = get(qi, "details.0.roundup.0") || {};

    state.brand = firstOf(get(d, "current_page.brand_name"), qi.brand_name, state.brand);
    state.currency = firstOf(get(d, "site.currency"), get(d, "site_details.currency"), state.currency);

    q.insurance_product      = firstOf(productOf(get(d, "current_page.insurance_product")), productOf(qi.quote_type), q.insurance_product);
    q.original_quote_source  = firstOf(qi.quote_source, q.original_quote_source);
    q.preferred_payment_method = firstOf(qi.preferred_payment_selection, q.preferred_payment_method);
    q.monthly_quote_amount   = firstOf(p.monthly_quote_amount, b.monthly_quote_amount, qi.monthly_quote_amount, q.monthly_quote_amount);
    q.annual_quote_amount    = firstOf(p.annual_quote_amount, b.annual_quote_amount, qi.annual_quote_amount, q.annual_quote_amount);
    q.payment_type_selection = firstOf(p.payment_type_selection, b.payment_type_selection, qi.payment_type_selection, q.payment_type_selection);
    q.quote_reference        = firstOf(qi.quote_reference, q.quote_reference);
    q.quote_tier             = firstOf(b.quote_tier, qi.quote_tier, q.quote_tier);
    q.coupon                 = firstOf(qi.coupon, q.coupon);
    q.currency               = firstOf(qi.currency, q.currency);
    q.add_ons                = firstOf(Array.isArray(b.add_ons) ? b.add_ons : undefined, Array.isArray(qi.add_ons) ? qi.add_ons : undefined, q.add_ons);
    if (r.number_of_drivers !== undefined || r.number_of_vehicles !== undefined ||
        r.number_of_pets !== undefined || r.number_of_properties !== undefined) {
      // ASSUMPTION to confirm: "additional" = total minus the first one.
      q.additions = {
        additional_drivers:    extra(r.number_of_drivers),
        additional_vehicles:   extra(r.number_of_vehicles),
        additional_pets:       extra(r.number_of_pets),
        additional_properties: extra(r.number_of_properties)
        // additional_businesses: no ACDL source in the Blueprint
      };
    }
  }

  /* =====================================================================
   * BUILDERS: one per MSG push shape
   * ===================================================================== */

  var warnedEmail = false;
  function userId(u) {
    var e = u && u.email_address;
    if (isHash(e)) { return lc(e); }
    if (e && !warnedEmail) { warnedEmail = true; stats.pii_redacted++; health("pii_redacted", "user.email_address", "not a sha-256 hash, dropped"); }
    return undefined;
  }
  function policies(d) {
    var list = get(d, "user.policy");
    if (!Array.isArray(list)) { list = Array.isArray(d.policy) ? d.policy : []; }
    return list;
  }
  function joined(list, key) {
    var out = [], i;
    for (i = 0; i < list.length; i++) { if (list[i] && list[i][key]) { out.push(list[i][key]); } }
    return out.length ? out.join("|") : undefined;
  }
  function userBasic(d) {
    var pol = policies(d);
    return {
      user_id: userId(d.user),
      policy_name: joined(pol, "policy_name"),
      policy_quantity: pol.length > 1 ? String(pol.length) : str(pol.length ? pol[0].policy_quantity : undefined),
      policy_status: joined(pol, "policy_status")
    };
  }

  function buildPage(d) {
    var cp = d.current_page || {}, u = userBasic(d);
    var onQuote = !QUOTE_FIELDS_ONLY_ON_QUOTE_PAGES || str(cp.quote_engine_step_nr) !== undefined;
    var q = onQuote ? state.quote : {};
    u.policy_reference = joined(policies(d), "policy_reference");
    u.quote_reference = q.quote_reference;
    u.login_data = state.login;
    return {
      page: {
        brand_name: brandOf(state.brand),
        insurance_product: q.insurance_product,
        quote_engine_step_nr: str(cp.quote_engine_step_nr),
        quote_engine_step_name: lc(cp.quote_engine_step_name),
        quote_engine_additions: q.additions,
        page_title: cp.url_title,
        page_path: cp.url_path,
        page_location: cp.full_url,
        original_quote_source: q.original_quote_source,
        preferred_payment_method: q.preferred_payment_method,
        monthly_quote_amount: q.monthly_quote_amount,
        annual_quote_amount: q.annual_quote_amount,
        payment_type_selection: q.payment_type_selection
      },
      user: u
    };
  }

  function addonTier(name) {
    var list = state.quote.add_ons || [], i;
    for (i = 0; i < list.length; i++) { if (lc(list[i].addon_name) === lc(name)) { return list[i].addon_tier; } }
    return undefined;
  }

  function buildEcommerce(d, isPurchase, name) {
    var p = d.payment || {}, q = state.quote;
    var lines = Array.isArray(p.line_items) ? p.line_items : [];
    var variant = firstOf(p.payment_type_selection, q.payment_type_selection);
    var brand = brandOf(state.brand), items = [], total = 0, i, li, addOn, price, cat;

    for (i = 0; i < lines.length; i++) {
      li = lines[i] || {};
      addOn = /add-?on/.test(lc(li.product_type || ""));
      price = num(li.item_amount);
      cat = addOn ? q.insurance_product : firstOf(productOf(li.product_type), q.insurance_product);
      items.push({
        item_name: li.product_name,          // no item_id exists in ACDL
        price: price,
        item_brand: brand,
        item_category: cat,
        item_category2: addOn ? "add-on" : "insurance",
        item_category3: addOn ? addonTier(li.product_name) : q.quote_tier,
        item_category4: (!addOn && cat === "home") ? li.cover_type : undefined,
        item_variant: variant,
        index: i + 1,
        quantity: 1
      });
      if (price !== undefined) { total += price; }
    }

    var e = {
      currency: firstOf(q.currency, state.currency, DEFAULT_CURRENCY),
      value: items.length ? Math.round(total * 100) / 100 : num(get(d, "quote_information.total_amount_payable")),
      coupon: q.coupon,
      items: items
    };
    if (isPurchase) {
      e.transaction_id = get(d, "policy.policy_reference");  // Blueprint: "used as the transaction identifier"
      e.tax = num(p.tax);                                     // not in the Blueprint yet
      e.payment_type = PAYMENT_TYPE_BY_FREQUENCY[lc(variant)];
      if (!e.transaction_id) { warn(name + " has no policy.policy_reference, so GA4 cannot de-duplicate it"); }
    }
    if (!items.length) { warn(name + " has no payment.line_items"); }
    return e;
  }

  var BUILDERS = {
    page: function (d) { return { aa: buildPage(d) }; },
    login: function (d) {
      state.loginAttempts++;
      state.login = { login_attempts: String(state.loginAttempts), login_result: "success" };
      state.loginAttempts = 0;
      return { event: "aa_login", aa: { user: userBasic(d) } };
    },
    login_failed: function (d) {
      state.loginAttempts++;
      state.login = { login_attempts: String(state.loginAttempts), login_result: "failure",
                      error_message: lc(get(d, "form.submission_message")) };
      return { event: "aa_login_failed", aa: { user: { login_data: state.login } } };
    },
    sign_up: function (d) { return { event: "aa_sign_up", aa: { user: userBasic(d) } }; },
    form: function (d) {
      var f = d.form || {}, res = resultOf(f.submission_status);
      return { event: "aa_form_submit", aa: { form_name: lc(f.name), form_result: res,
               error_message: res === "failure" ? lc(f.submission_message) : undefined } };
    },
    lookup: function (d) {
      var l = d.lookup || {};
      return { event: "aa_lookup", aa: { lookup_name: lc(l.name), lookup_result: resultOf(l.result),
               error_message: lc(l.error_message) } };
    },
    live_chat: function () { return { event: "aa_live_chat" }; },
    begin_checkout: function (d, name) {
      return { event: "aa_begin_checkout", aa: { purchase_type: get(d, "payment.purchase_type"),
               ecommerce: buildEcommerce(d, false, name) } };
    },
    purchase: function (d, name) {
      return { event: "aa_purchase", aa: { purchase_type: get(d, "payment.purchase_type"),
               ecommerce: buildEcommerce(d, true, name) } };
    }
  };

  /* =====================================================================
   * ENGINE: no edits needed below this line.
   * ===================================================================== */

  var stats = { received: 0, forwarded: 0, mapped: 0, unmapped: 0, duplicates: 0,
                rate_limited: 0, pii_redacted: 0, incomplete: 0, errors: 0,
                total_ms: 0, max_ms: 0 };
  var healthSent = 0, healthSeen = {}, pendingHealth = [];
  var seenIds = {}, seenIdList = [];
  var rateWindow = 0, rateCount = 0, pageCount = 0;
  var now = (w.performance && w.performance.now) ? function () { return w.performance.now(); } : function () { return +new Date(); };

  function health(issue, name, detail) {
    var key = issue + "|" + name;
    if (healthSeen[key] || healthSent >= LIMITS.healthEvents) { return; }   // once per issue, capped
    healthSeen[key] = true; healthSent++;
    pendingHealth.push({ event: "acdl_bridge_health", acdl_bridge: { version: VERSION, issue: issue,
               acdl_event: name, detail: String(detail || "").slice(0, 100) } });
    warn(issue + " on " + name + (detail ? ": " + detail : ""));
  }

  function luhn(digits) {
    var sum = 0, alt = false, i, n;
    for (i = digits.length - 1; i >= 0; i--) {
      n = +digits.charAt(i);
      if (alt) { n *= 2; if (n > 9) { n -= 9; } }
      sum += n; alt = !alt;
    }
    return digits.length >= 13 && sum % 10 === 0;
  }

  function scrubString(v, counter) {
    var before = v, k;
    v = v.replace(PII_PATTERNS.email, "[redacted]");
    v = v.replace(PII_PATTERNS.card, function (m) { return luhn(m.replace(/\D/g, "")) ? "[redacted]" : m; });
    v = v.replace(PII_PATTERNS.phone, "[redacted]");
    v = v.replace(PII_PATTERNS.postcode, "[redacted]");

    form: ["aa.form_name", "aa.form_result"],
    lookup: ["aa.lookup_name", "aa.lookup_result"],
    begin_checkout: ["aa.ecommerce.value", "aa.ecommerce.items"],

        arr = [];
        for (i = 0; i < v.length; i++) { arr.push(cols[order[c]][i] === undefined ? "" : String(cols[order[c]][i])); }

    }

  }

  function buildUnmapped(name, d) {
    var base = name.indexOf("aa_") === 0 ? name.slice(3) : name;    // no aa_aa_ doubling
    var evt = UNMAPPED_PREFIX + base;
    if (MSG_EVENTS[evt]) {
      evt = COLLISION_PREFIX + base;
      health("name_collision", name, "sent as " + evt);
    }
    var box = {}, k, f, m, v, sk;

    if (UNMAPPED_FLATTEN === "off") {
      for (k in d) {
        if (!d.hasOwnProperty(k) || k === "event_id") { continue; }

      }
    } else {
      var deep = UNMAPPED_FLATTEN === "full", entries = [], counts = {}, used = 0;
      for (k in d) {
        if (!d.hasOwnProperty(k) || k === "event_id") { continue; }  // event_id already sits at top level
        v = d[k]; sk = safeKey(k); m = {};

          for (f in m) { if (m.hasOwnProperty(f)) { entries.push({ short: f, full: sk + "_" + f, value: m[f] }); } }
        } else {
          // Lists and single values keep their own name (products -> products_name)
          flatInto(m, sk, v, 0, deep);
          for (f in m) { if (m.hasOwnProperty(f)) { entries.push({ short: f, full: f, value: m[f] }); } }
        }
      }
      for (f = 0; f < entries.length; f++) { counts[entries[f].short] = (counts[entries[f].short] || 0) + 1; }
      for (f = 0; f < entries.length; f++) {
        var e = entries[f];
        var key = (counts[e.short] > 1 || MSG_AA_KEYS[e.short]) ? e.full : e.short;
        if (MSG_AA_KEYS[key]) { key = "acdl_" + key; }
        key = key.slice(0, LIMITS.maxKeyLength);
        var n = 2, unique = key;
        while (box.hasOwnProperty(unique)) { unique = key + "_" + (n++); }
        if (used >= LIMITS.maxFlatKeys) { health("too_many_keys", name, entries.length + " keys, kept " + LIMITS.maxFlatKeys); break; }
        box[unique] = e.value; used++;

    }

    out[UNMAPPED_CONTAINER] = box;
    return out;
  }

  function addRule(acdlName, spec) {
    if (!acdlName || !spec || !spec.event || !spec.fields) { warn("addRule needs a name, spec.event and spec.fields"); return false; }
    var id = "custom:" + lc(acdlName);
    BUILDERS[id] = declarative(spec);
    REQUIRED[id] = spec.required || [];
    EVENT_RULES[lc(acdlName)] = id;
    MSG_EVENTS[spec.event] = 1;          // later unmapped events can't collide with it
    return true;
  }
  for (var r in CUSTOM_RULES) { if (CUSTOM_RULES.hasOwnProperty(r)) { addRule(r, CUSTOM_RULES[r]); } }

  function allowRate() {
    var t = Math.floor(+new Date() / 1000);

    rateCount++; pageCount++;

  }
  function isDuplicate(id) {
    if (!id) { return false; }
    id = String(id);
    if (seenIds[id]) { return true; }

  }

  function forward(item) {
    var t0 = now(), name = "unknown";
    try {
      if (!item || typeof item !== "object" || !(item.event || item.eventName)) { return; }
      if (item.__acdlSent) { return; }                       // never send the same object twice
      try { Object.defineProperty(item, "__acdlSent", { value: true }); } catch (ignore) {}
      stats.received++;

      // Event names become GTM trigger names, so keep them clean and short.
      name = lc(String(item.event || item.eventName)).replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "unnamed";
      var d = (item.data && typeof item.data === "object") ? item.data
            : (item.eventInfo && typeof item.eventInfo === "object") ? item.eventInfo : {};

      if (isDuplicate(d.event_id)) { stats.duplicates++; return; }   // Blueprint: retries reuse event_id
      if (!allowRate()) { stats.rate_limited++; health("rate_limited", name, LIMITS.perSecond + "/s"); return; }

        return;
      }

        var spa = state.pageViews > 1 || /history/.test(lc(String(d.event_trigger || "")));

        else if (FIRST_LOAD_EVENT) { out.event = FIRST_LOAD_EVENT; }

      out = scrub(clean(out) || {}, "", 0, counter);
      if (counter.n) { stats.pii_redacted += counter.n; health("pii_redacted", name, counter.n + " value(s)"); }

      if (d.event_id) { out.event_id = String(d.event_id).slice(0, 100); }

      }
      if (rule === "begin_checkout" || rule === "purchase") {
        GDL.push({ aa: { ecommerce: null } });               // MSG: clear the previous ecommerce object
      }

    } catch (e) {

      health("error", name, e && e.message);                 // never break the site's own push
    } finally {
      var ms = now() - t0;
      stats.total_ms += ms;
      if (ms > stats.max_ms) { stats.max_ms = ms; }
      if (ms > LIMITS.slowEventMs) { health("slow", name, Math.round(ms) + "ms"); }

    }

    version: VERSION,
    stats: stats,
    addRule: addRule,
    rules: function () { var o = [], k; for (k in EVENT_RULES) { if (EVENT_RULES.hasOwnProperty(k)) { o.push(k + " -> " + EVENT_RULES[k]); } } return o; }

  function wrap() {
    var inner = ADL.push;
    if (inner && inner.__acdlBridged) { return; }

      var result = inner.apply(ADL, arguments);             // site's push always runs first

  //    and it runs queued functions when it boots, so this re-wraps it.
  Array.prototype.push.call(ADL, function () { wrap(); w.setTimeout(wrap, 0); });
})(window);
